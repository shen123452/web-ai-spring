server:
  port: 8080
spring:
  application:
    name: tlias-web
    #数据库连接信息
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tlias
    username: root
    password: 123456
    #mybatis配置
mybatis:
  mapper-locations: classpath:com/hhh/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    #日志配置
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
    #阿里云 oss
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: 2005java
    region: cn-beijing

jwt:
  secret-key: tlias-web-demo-secret-key-please-change-this
  ttl: 604800000
  header-name: Authorization



